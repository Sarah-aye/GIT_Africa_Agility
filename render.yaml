services:
  - type: web
    name: farmfoodhub
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn farmfoodhub.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: farmfoodhub.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False