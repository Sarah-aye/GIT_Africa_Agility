{% extends "base.html" %}
{% block title %}NGO Profile{% endblock %}

{% block content %}
<h2>{{ is_editing|yesno:"Edit,Create" }} NGO Profile</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
</form>
{% endblock %}
