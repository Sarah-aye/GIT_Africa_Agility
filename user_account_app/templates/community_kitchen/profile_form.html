{% extends "base.html" %}
{% block title %}Community Kitchen Profile{% endblock %}

{% block content %}
<h2>{{ is_editing|yesno:"Edit,Create" }} Community Kitchen Profile</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
