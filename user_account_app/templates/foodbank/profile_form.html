{% extends "base.html" %}
{% block title %}Food Bank Profile{% endblock %}

{% block content %}
<h2>{{ is_editing|yesno:"Edit,Create" }} Food Bank Profile</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-info">Save</button>
</form>
{% endblock %}
